<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Fixed-domain line chart</title>
<desc id="desc">Two series on a fixed minus one to plus one scale. A rises from minus 0.6 to 0.5; B from minus 0.4 to 0.7.</desc>
<rect width="720" height="480" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="18" fill="#17212b">
<text x="50" y="36" font-size="24">Fixed-domain line chart</text>
<line x1="90" y1="80" x2="90" y2="370" stroke="#17212b" stroke-width="2" /><line x1="90" y1="370" x2="650" y2="370" stroke="#17212b" stroke-width="2" /><text x="35" y="376" >-1</text><line x1="90" y1="370" x2="650" y2="370" stroke="#17212b" stroke-width="2" stroke-dasharray="2 6"/><text x="35" y="303.5" >-0.5</text><line x1="90" y1="297.5" x2="650" y2="297.5" stroke="#17212b" stroke-width="2" stroke-dasharray="2 6"/><text x="35" y="231" >0</text><line x1="90" y1="225" x2="650" y2="225" stroke="#17212b" stroke-width="2" stroke-dasharray="2 6"/><text x="35" y="158.5" >0.5</text><line x1="90" y1="152.5" x2="650" y2="152.5" stroke="#17212b" stroke-width="2" stroke-dasharray="2 6"/><text x="35" y="86" >1</text><line x1="90" y1="80" x2="650" y2="80" stroke="#17212b" stroke-width="2" stroke-dasharray="2 6"/><text x="110" y="402" >Jan</text><circle cx="130" cy="312.0" r="5" fill="white" stroke="#17212b" stroke-width="2"/><rect x="125" y="278.0" width="10" height="10" fill="white" stroke="#17212b" stroke-width="2"/><text x="260" y="402" >Feb</text><line x1="130" y1="312.0" x2="280" y2="254.0" stroke="#17212b" stroke-width="2" /><circle cx="280" cy="254.0" r="5" fill="white" stroke="#17212b" stroke-width="2"/><line x1="130" y1="283.0" x2="280" y2="210.5" stroke="#17212b" stroke-width="2" stroke-dasharray="8 5"/><rect x="275" y="205.5" width="10" height="10" fill="white" stroke="#17212b" stroke-width="2"/><text x="410" y="402" >Mar</text><line x1="280" y1="254.0" x2="430" y2="181.5" stroke="#17212b" stroke-width="2" /><circle cx="430" cy="181.5" r="5" fill="white" stroke="#17212b" stroke-width="2"/><line x1="280" y1="210.5" x2="430" y2="196.0" stroke="#17212b" stroke-width="2" stroke-dasharray="8 5"/><rect x="425" y="191.0" width="10" height="10" fill="white" stroke="#17212b" stroke-width="2"/><text x="560" y="402" >Apr</text><line x1="430" y1="181.5" x2="580" y2="152.5" stroke="#17212b" stroke-width="2" /><circle cx="580" cy="152.5" r="5" fill="white" stroke="#17212b" stroke-width="2"/><line x1="430" y1="196.0" x2="580" y2="123.5" stroke="#17212b" stroke-width="2" stroke-dasharray="8 5"/><rect x="575" y="118.5" width="10" height="10" fill="white" stroke="#17212b" stroke-width="2"/><text x="90" y="435" >Solid/circle: A; dashed/square: B.</text><text x="90" y="460" >Signed assessments, not probabilities.</text>
</g>
</svg>
