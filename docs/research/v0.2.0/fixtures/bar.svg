<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Column comparison</title>
  <desc id="desc">Four ordered categories. Filled and outlined bars distinguish components without colour. See accompanying data alternative.</desc>
  <rect width="720" height="560" fill="white" />
  <g font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="32" fill="#17212b">
    <text x="50" y="36" font-size="38">Column comparison</text>
    <line x1="90" y1="80" x2="90" y2="370" stroke="#17212b" stroke-width="3" />
    <line x1="90" y1="370" x2="650" y2="370" stroke="#17212b" stroke-width="3" />
    <rect x="130" y="270" width="45" height="100" fill="#555" />
    <text x="125" y="402">A</text>
    <rect x="265" y="190" width="45" height="180" fill="#555" />
    <text x="260" y="402">B</text>
    <rect x="400" y="230" width="45" height="140" fill="#555" />
    <text x="395" y="402">C</text>
    <rect x="535" y="150" width="45" height="220" fill="#555" />
    <text x="530" y="402">D</text>
    <text x="90" y="440">
      <tspan x="90.0" y="440">Filled: primary; outlined:</tspan>
      <tspan x="90.0" y="478">comparison/component. Synthetic</tspan>
      <tspan x="90.0" y="516">values.</tspan>
    </text>
  </g>
</svg>
