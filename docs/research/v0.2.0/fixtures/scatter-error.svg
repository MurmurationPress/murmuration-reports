<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Scatter with labelled uncertainty</title>
<desc id="desc">Four numeric XY observations, values increase with distance. Asymmetric error bars are supplied 95 percent confidence bounds.</desc>
<rect width="720" height="480" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="18" fill="#17212b">
<text x="50" y="36" font-size="24">Scatter with labelled uncertainty</text>
<line x1="90" y1="80" x2="90" y2="370" stroke="#17212b" stroke-width="2" /><line x1="90" y1="370" x2="650" y2="370" stroke="#17212b" stroke-width="2" /><text x="90" y="435" >Distance (km); supplied asymmetric 95% CI, not calculated here.</text><line x1="150" y1="320" x2="150" y2="245" stroke="#17212b" stroke-width="2" /><line x1="140" y1="320" x2="160" y2="320" stroke="#17212b" stroke-width="2" /><line x1="140" y1="245" x2="160" y2="245" stroke="#17212b" stroke-width="2" /><circle cx="150" cy="290" r="6"/><text x="145" y="402" >1</text><line x1="290" y1="265" x2="290" y2="200" stroke="#17212b" stroke-width="2" /><line x1="280" y1="265" x2="300" y2="265" stroke="#17212b" stroke-width="2" /><line x1="280" y1="200" x2="300" y2="200" stroke="#17212b" stroke-width="2" /><circle cx="290" cy="230" r="6"/><text x="285" y="402" >2</text><line x1="450" y1="220" x2="450" y2="145" stroke="#17212b" stroke-width="2" /><line x1="440" y1="220" x2="460" y2="220" stroke="#17212b" stroke-width="2" /><line x1="440" y1="145" x2="460" y2="145" stroke="#17212b" stroke-width="2" /><circle cx="450" cy="180" r="6"/><text x="445" y="402" >3</text><line x1="590" y1="155" x2="590" y2="95" stroke="#17212b" stroke-width="2" /><line x1="580" y1="155" x2="600" y2="155" stroke="#17212b" stroke-width="2" /><line x1="580" y1="95" x2="600" y2="95" stroke="#17212b" stroke-width="2" /><circle cx="590" cy="120" r="6"/><text x="585" y="402" >4</text><text x="40" y="85" >Value</text>
</g>
</svg>
