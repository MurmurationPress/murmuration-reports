<g font-family="DejaVu Sans, sans-serif" font-size="18" fill="#17212b">
<text x="50" y="36" font-size="24">Stacked comparison</text>
<line x1="90" y1="80" x2="90" y2="370" stroke="#17212b" stroke-width="2" /><line x1="90" y1="370" x2="650" y2="370" stroke="#17212b" stroke-width="2" /><rect x="130" y="270" width="45" height="100" fill="#555"/><rect x="130" y="215" width="45" height="55" fill="white" stroke="#17212b" stroke-width="2"/><text x="125" y="402" >A</text><rect x="265" y="190" width="45" height="180" fill="#555"/><rect x="265" y="135" width="45" height="55" fill="white" stroke="#17212b" stroke-width="2"/><text x="260" y="402" >B</text><rect x="400" y="230" width="45" height="140" fill="#555"/><rect x="400" y="175" width="45" height="55" fill="white" stroke="#17212b" stroke-width="2"/><text x="395" y="402" >C</text><rect x="535" y="150" width="45" height="220" fill="#555"/><rect x="535" y="95" width="45" height="55" fill="white" stroke="#17212b" stroke-width="2"/><text x="530" y="402" >D</text><text x="90" y="445" >Filled: primary; outlined: comparison/component. Synthetic values.</text>
