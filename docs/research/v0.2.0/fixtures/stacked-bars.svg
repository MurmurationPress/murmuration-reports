<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Stacked comparison</title>
<desc id="desc">Four ordered categories. Filled and outlined bars distinguish components without colour. See accompanying data alternative.</desc>
