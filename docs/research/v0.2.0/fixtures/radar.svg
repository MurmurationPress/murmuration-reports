<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Radar: declared common scale</title>
<desc id="desc">Ordered dimensions A B C D share zero to one domain. Values 0.7, 0.6, 0.8, 0.5. Area is not a total.</desc>
<rect width="720" height="480" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="18" fill="#17212b">
<text x="50" y="36" font-size="24">Radar: declared common scale</text>
<polygon points="360.0,85.0 510.0,235.0 360.0,385.0 210.0,235.00000000000003" fill="none" stroke="#777" stroke-width="2"/><line x1="360" y1="235" x2="360.0" y2="85.0" stroke="#17212b" stroke-width="2" /><text x="348.0" y="73.0" >A</text><line x1="360" y1="235" x2="510.0" y2="235.0" stroke="#17212b" stroke-width="2" /><text x="498.0" y="223.0" >B</text><line x1="360" y1="235" x2="360.0" y2="385.0" stroke="#17212b" stroke-width="2" /><text x="348.0" y="373.0" >C</text><line x1="360" y1="235" x2="210.0" y2="235.00000000000003" stroke="#17212b" stroke-width="2" /><text x="198.0" y="223.00000000000003" >D</text><polygon points="360,130 450,235 360,355 285,235" fill="none" stroke="#17212b" stroke-width="3"/><text x="90" y="445" >A=.7 B=.6 C=.8 D=.5; shared 0–1 domain. Area is not a total.</text>
</g>
</svg>
